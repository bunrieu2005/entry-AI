<div class="app-wrapper">
  <app-sidebar [activeId]="activeModuleId" (moduleSelected)="onModuleSelected($event)"></app-sidebar>

  <div class="app-content">
    <app-header></app-header>

    <main class="main-content" role="main">

      <!-- Home page: show Hero Section -->
      <app-hero-section
        *ngIf="isHomePage"
        [title]="getHeroTitle()"
        [subtitle]="getHeroSubtitle()"
        [isHome]="true"
        (cardSelected)="onModuleSelected($event)">
      </app-hero-section>

      <!-- Static module pages -->
      <app-guides *ngIf="isGuidesModule && !isHomePage" [isFocusLocked]="isLockedInsideModule"></app-guides>
      <app-ai-tools *ngIf="isExploreModule && !isHomePage" [isFocusLocked]="isLockedInsideModule"></app-ai-tools>
      <app-glossary *ngIf="isGlossaryModule && !isHomePage" [isFocusLocked]="isLockedInsideModule"></app-glossary>
      <app-prompts *ngIf="isPromptsModule && !isHomePage" [isFocusLocked]="isLockedInsideModule"></app-prompts>

      <!-- Router-driven sub-pages: Vibe Coding & AI Guidelines -->
      <router-outlet *ngIf="isVibeModule || isAiGuidelinesModule"></router-outlet>

    </main>
  </div>
</div>
