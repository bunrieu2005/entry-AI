<div class="app-wrapper">

  <app-header [currentPageName]="getPageName()"></app-header>

  <div class="app-body">
    <app-sidebar
      [activeId]="activeModuleId"
      [focusedModuleId]="keyboardNavigation.focusedSidebarModule()"
      [isKeyboardLocked]="keyboardNavigation.isFocusLocked()"
      (moduleSelected)="onModuleSelected($event)">
    </app-sidebar>

    <main class="main-content" role="main">
      <app-hero-section
        *ngIf="isHomePage && isHomeModule"
        [title]="getHeroTitle()"
        [subtitle]="getHeroSubtitle()"
        [isHome]="true"
        (cardSelected)="onModuleSelected($event)">
      </app-hero-section>

      <app-ai-tools *ngIf="isExploreModule && !isHomePage"></app-ai-tools>
      <app-glossary *ngIf="isGlossaryModule && !isHomePage" [isFocusLocked]="isLockedInsideModule"></app-glossary>
      <app-prompts *ngIf="isPromptsModule && !isHomePage" [isFocusLocked]="isLockedInsideModule"></app-prompts>
      <app-favorite-prompts *ngIf="isFavoritePromptsModule && !isHomePage"></app-favorite-prompts>

      <router-outlet *ngIf="isAiGuidelinesModule"></router-outlet>

      <footer class="footer">
        <div class="footer-container">
          <div class="footer-brand">
            <div class="footer-logo">
              <i class="ti ti-binary"></i>
              <span>EntryAI</span>
            </div>
            <p>Nền tảng tối ưu hóa câu lệnh cho kỹ sư hệ thống Việt Nam.</p>
          </div>

          <div class="footer-nav">
            <span class="footer-label">> INDEX_</span>
            <div class="footer-links">
              <a (click)="onModuleSelected('home')">Trang chủ</a>
              <a (click)="onModuleSelected('prompts')">Thư viện Prompt</a>
              <a (click)="onModuleSelected('explore')">Khám phá</a>
            </div>
          </div>

          <div class="footer-status">
            <span class="footer-label">> SYS_STATUS_</span>
            <div class="status-grid">
              <div class="status-item"><span>Build:</span> v2.0.4</div>
              <div class="status-item"><span>UI:</span> WCAG 2.2</div>
              <div class="status-item"><span>Engine:</span> Angular 17</div>
            </div>
          </div>
        </div>

        <div class="footer-bottom">
          <div class="copyright">© 2026 ENTRYAI. ALL RIGHTS RESERVED.</div>
          <div class="author">CODED BY <span class="highlight">TRAN VU TAN</span></div>
        </div>
      </footer>

    </main>
  </div>
</div>
