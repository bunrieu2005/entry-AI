<aside class="sidebar" role="navigation" aria-label="Điều hướng chính">
  <div class="sidebar__header"></div>

  <nav class="sidebar__nav">
    <ul class="sidebar__list" role="list">
      <li *ngFor="let mod of modules; let i = index" class="sidebar__item">
        <button
          type="button"
          class="sidebar__btn"
          [class.sidebar__btn--active]="isActive(mod.id) || hasActiveChild(mod)"
          [class.sidebar__btn--focused]="isKeyboardLocked && isFocused(mod.id)"
          (click)="selectModule(mod.id)"
          role="menuitem">

          <span class="sidebar__icon" aria-hidden="true">
            <ng-container [ngSwitch]="mod.customIcon">
              <app-home-icon *ngSwitchCase="'home'" [size]="20"></app-home-icon>
              <app-openai-icon *ngSwitchCase="'openai'" [size]="20"></app-openai-icon>
              <app-library-icon *ngSwitchCase="'library'" [size]="20"></app-library-icon>
              <app-paypal-icon *ngSwitchCase="'paypal'" [size]="20"></app-paypal-icon>
              <app-hand-heart-icon *ngSwitchCase="'hand-heart'" [size]="20"></app-hand-heart-icon>
              <app-book-icon *ngSwitchCase="'book'" [size]="20"></app-book-icon>
              <i *ngSwitchDefault class="ti" [ngClass]="mod.icon"></i>
            </ng-container>
          </span>

          <span class="sidebar__text">
            <span class="sidebar__name">
              {{ mod.name }}

              <span
                class="sidebar__shortcut"
                aria-hidden="true">
                {{ i + 1 }}
              </span>

            </span>
          </span>
        </button>
      </li>
    </ul>

  <!-- Nút WCAG ngay dưới list -->
  <div class="sidebar__wcag-inline">
    <button
      type="button"
      class="sidebar__btn wcag-btn"
      [class.wcag-btn--active]="isWcagModeActive"
      (click)="toggleWcagMode()">
      <span class="sidebar__icon">
        <i class="ti ti-accessible"></i>
      </span>
      <span class="sidebar__text">
        <span class="sidebar__name">Keyboard (Alt)</span>
      </span>
      <div class="wcag-toggle-switch">
        <div class="wcag-toggle-thumb"></div>
      </div>
    </button>

    <!-- Hint bar -->
    <div class="sidebar__hint" *ngIf="isWcagModeActive">
      <span>Enter</span> Vào Trang
      <span>Alt</span> tắt
    </div>
  </div>
</nav>
</aside>
