<header class="header" role="banner">
  <div class="header__brand">
    <span class="header__logo" aria-label="EntryAI">
      <i class="ti ti-brain"></i>
    </span>
    <span class="header__wordmark">EntryAI</span>
  </div>

  <div class="header__actions">
    <ng-container *ngIf="(currentUser$ | async) === null; else loggedInTpl">
      <button class="btn-auth" (click)="openModal('login')">Đăng nhập</button>
      <button class="btn-auth btn-outline" (click)="openModal('register')">Đăng ký</button>
    </ng-container>

    <ng-template #loggedInTpl>
      <div class="user-logged-in">
        <div class="user-avatar">{{ (currentUser$ | async)?.characterAvatar || '😎' }}</div>
        <span class="user-name">{{ (currentUser$ | async)?.displayName || (currentUser$ | async)?.username }}</span>
      </div>
      <button class="btn-logout" (click)="logout()" title="Đăng xuất">
        <i class="ti ti-logout"></i> Đăng xuất
      </button>
    </ng-template>

    <button type="button" class="header__action-btn" aria-label="Cài đặt">
      <i class="ti ti-settings"></i>
    </button>
  </div>
</header>

<div class="modal-overlay" *ngIf="showModal">
  <div class="modal-box">
    
    <div class="modal-title">
        {{ authMode === 'login' ? 'Đăng nhập hệ thống' : 'Đăng ký tài khoản' }}
      </div>
      
      <div class="form-group">
        <label>Tài khoản</label>
        <input type="text" placeholder="Nhập username..." [(ngModel)]="authData.username">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" placeholder="Nhập password..." [(ngModel)]="authData.password">
      </div>
      <div class="form-group" *ngIf="authMode === 'register'">
        <label>Xác nhận mật khẩu</label>
        <input type="password" placeholder="Nhập lại password..." [(ngModel)]="authData.confirmPassword">
      </div>
      
      <div class="modal-actions">
        <button class="btn-cancel" (click)="closeModal()">Hủy</button>
        <button class="btn-full" (click)="submitStep1()">
          {{ authMode === 'login' ? 'Đăng nhập' : 'Tiếp tục' }} <i *ngIf="authMode === 'register'" class="ti ti-arrow-right"></i>
        </button>
      </div>

      <div class="auth-switch">
        <span *ngIf="authMode === 'login'">
          Chưa có tài khoản? <a href="javascript:void(0)" (click)="authMode = 'register'">Đăng ký ngay</a>
        </span>
        <span *ngIf="authMode === 'register'">
          Đã có tài khoản? <a href="javascript:void(0)" (click)="authMode = 'login'">Đăng nhập</a>
        </span>
      </div>

  </div>
</div>
