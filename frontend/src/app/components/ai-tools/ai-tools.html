<article class="ai-tools">

  <div *ngIf="isFocusLocked" class="nav-banner">
    <i class="ti ti-device-gamepad"></i>
    <span *ngIf="currentZone === 'ZONE_FILTERS'">
      Dùng <kbd>A</kbd><kbd>D</kbd> lướt thẻ &bull; <kbd>S</kbd> xuống Grid &bull; <kbd>ESC</kbd> thoát
    </span>
    <span *ngIf="currentZone === 'ZONE_MAIN'">
      Dùng <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> lướt &bull; <kbd>W</kbd> ở đầu để lên thẻ &bull; <kbd>Enter</kbd> truy cập
    </span>
  </div>

  <header>
    <h1 class="ai-tools__title">Khám Phá AI</h1>
    <p class="ai-tools__subtitle">Kho công cụ AI tốt nhất được tuyển chọn cẩn thận.</p>
  </header>

  <div *ngIf="isLoading" class="state-box">
    <div class="spinner"></div>
    <span>Đang tải kho chứa...</span>
  </div>

  <div class="tabs" *ngIf="!isLoading && groupedTools.length > 0">
    <button 
      class="tab"
      *ngFor="let group of groupedTools; let i = index; trackBy: trackByCategoryId"
      [class.active]="i === activeCategoryIndex"
      [class.is-keyboard-highlighted]="isFocusLocked && currentZone === 'ZONE_FILTERS' && i === highlightedIndex"
      (click)="selectCategory(i)"
      tabindex="-1"> 
      <span>{{ group.category.name }}</span>
      <span class="tab-badge">{{ group.tools.length }}</span>
    </button>
  </div>

  <div class="grid" *ngIf="!isLoading && currentTools.length > 0">
    
    <div 
      class="card-wrap"
      *ngFor="let tool of currentTools; let i = index; trackBy: trackByToolId"
      [class.is-keyboard-highlighted]="isFocusLocked && currentZone === 'ZONE_MAIN' && i === highlightedIndex">
      
      <article class="card">
        
        <div class="card-head">
          <div class="card-logo" *ngIf="tool.logoUrl; else noLogo">
            <img [src]="tool.logoUrl" [alt]="tool.name" onerror="this.src='/assets/logos/default.png'">
          </div>
          <ng-template #noLogo>
            <div class="logo-text">{{ tool.name.charAt(0).toUpperCase() }}</div>
          </ng-template>

          <div class="card-info">
            <h3 class="card-title">{{ tool.name }}</h3>
            <span class="card-tag">{{ tool.useCaseTag }}</span>
          </div>
        </div>

        <p class="card-desc-short">{{ tool.taglineVi }}</p>

        <div class="card-body">
          <div class="card-desc-full" [innerHTML]="tool.descriptionVi"></div>
          <button class="btn" (click)="openToolWebsite(tool.websiteUrl)" tabindex="-1">
            <i class="ti ti-external-link"></i> Truy cập công cụ
          </button>
        </div>

      </article>
    </div>

  </div>

</article>
